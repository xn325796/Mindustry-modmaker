# Validation findings. The UI renders these through the locale bundle; the English text is also
# what Issue.message() renders for logs, the console and tests. {0}/{1}... are plain replacements
# (see TextTemplate), so an apostrophe stays as written.
validate.meta.emptyName=mod name is empty; every content name and bundle key depends on it
validate.meta.badFileName=the package root holds '{0}', but the game only probes mod.json, mod.hjson, plugin.json and plugin.hjson there - it would report 'No mod.json found'
validate.meta.minGameVersion.empty=minGameVersion is empty; the game defaults it to 0, which is below the oldest build it accepts, so the whole mod is dropped as outdated
validate.meta.minGameVersion.badFormat=minGameVersion '{0}' is not a build number like 160 or 160.7; the game reads only the number before the first dot and treats anything else as 0, dropping the whole mod as outdated
validate.meta.minGameVersion.tooHigh=minGameVersion '{0}' requires build {1}, above the current 160.x; the game will not load this mod on 160.x
validate.meta.minGameVersion.classModTooOld=this is a class mod (java/main) but minGameVersion '{0}' is below 154; the game treats Java mods below 154 as outdated and never loads their code - raise minGameVersion or set legacyCompatible: true
validate.meta.minGameVersion.tooOld=minGameVersion '{0}' is below 136; the game marks mods below that build as outdated and silently drops the whole mod - raise it or set legacyCompatible: true
validate.encoding.metaBom=the meta file starts with a UTF-8 BOM; the game's parser reads it as garbage before the first key - resave it as UTF-8 without BOM
validate.encoding.contentBom=content '{0}' starts with a UTF-8 BOM; the game's parser reads it as garbage before the first key - resave it as UTF-8 without BOM
validate.name.duplicate=two {0} records are named '{1}'; the game throws on duplicate content names
validate.name.duplicatePatch=two {0} records are named '{1}'; the game applies both patches in sequence, but keep in mind each becomes its own file
validate.name.caseCollision={0} records named '{1}' and '{2}' differ only in case; Windows and macOS cannot store both as files, so one record would be lost on save
validate.name.invalid={0} '{1}': {2}
validate.type.notFileBacked={0} '{1}' cannot be a file: the game has no parser for content/{2}
validate.class.missingType={0} '{1}' declares no "type"; the game requires one for {0}
validate.class.unknown={0} '{1}' uses class '{2}', which this schema generation does not know - its fields fall back to raw JSON
validate.class.typeMismatch={0} '{1}' declares class '{2}', which belongs to {3}
validate.block.patchWithType=block '{0}' patches vanilla content but declares a type, which makes it a new block instead
validate.block.tooLarge=block '{0}' has size {1}, above the game's maximum of {2}: the block parser throws "Blocks cannot be larger than {2}" and the file fails to load
validate.unit.badType=unit '{0}' declares type '{1}', which the game rejects - unit types are the movement kinds {2}, not class names
validate.unit.typeNotString=unit '{0}' declares type as an object or array; the game throws "Types must be strings" and the file fails to load
validate.unit.badTemplate=unit '{0}' has template '{1}', which is not a class the game ships; the game logs it and builds UnitType instead, so the template's defaults are lost
validate.inline.noHost=inline {0} '{1}' has no host record, so it would never be written
validate.sprite.missing={0} '{1}' has no sprite: the game looks for region '{2}', built from sprites/{3}.png or from variant files such as {4}1.png or {5}-glow.png
validate.reference.unresolved={0} '{1}' references '{2}' in {3}, which is neither content of this mod nor known vanilla content
validate.reference.shadowsVanilla={0} '{1}' references '{2}' in {3}, which this mod also defines: the bare name binds to the vanilla entry, so write '{4}-{5}' to reach the mod's own
validate.contentOrder.unknown=contentOrder lists '{0}', which matches no content file name
validate.bundle.orphanKey=bundle key '{0}' has no matching content file; the game will ignore it
validate.board.danglingCard=board '{0}' has a card whose content no longer exists; it will disappear on save
validate.team.missingField=team '{0}' has no "team" key; the game's team parser throws "Team field missing." and the entry fails to load
validate.team.notPrimitive=team '{0}' sets "team" to something that is neither a team name nor a number (an array, object or null); the game's team parser throws "Unknown team" for anything else
validate.team.idOutOfRange=team '{0}' sets "team": {1}, but the game only knows ids 0 to {2} (Team.all) and throws "Unknown team" for anything else
validate.team.badName=team '{0}' sets "team": '{1}', which is not a team the game can resolve by name - the parser only searches the base teams ({2}) and throws "Unknown team"; other teams are reachable by id alone
validate.bullet.reachShort=bullet '{0}' inside {1} '{2}' flies {3} tiles (speed x lifetime = {4}), short of the turret's range {5} - targets at the edge of the range circle are never hit
validate.bullet.reachLong=bullet '{0}' inside {1} '{2}' flies {3} tiles (speed x lifetime = {4}), over three times the turret's range {5} - it despawns far past every target, which is usually a typo in lifetime
validate.drill.noTier=drill '{0}' declares no tier; the game default is 0, so it mines nothing with hardness 1 or above
validate.drill.tierTooLow=drill '{0}' has tier {1}, which cannot mine item '{2}' (hardness {3})
validate.item.unmineable=item '{0}' has hardness {1}, above every drill in this mod and the vanilla maximum of {2} - nothing in the game can mine it
validate.environment.noSprite=environment block '{0}' has no sprite: the game builds its terrain from sprites/blocks/environment/{1}.png or variant files such as {2}1.png, and otherwise renders the pink-black missing-texture checkerboard
validate.environment.wrongFolder=environment block '{0}' has its sprite outside sprites/blocks/environment/, so the map editor's environment palette will not list it
validate.crafter.outputItemIgnored=block '{0}' sets both outputItem and outputItems; the game only reads outputItems and silently ignores outputItem
validate.crafter.liquidFullnessUnset=block '{0}' outputs liquid but leaves ignoreLiquidFullness unset: once nothing accepts the output liquid the crafter stalls - set ignoreLiquidFullness: true to keep crafting while full
validate.crafter.batchTooBig=block '{0}' consumes a batch of {1} items but itemCapacity is {2}{3} - it can never hold a full batch and stalls; raise itemCapacity
validate.sound.badExtension=sound '{0}' is a .{1} file; the game's loader only accepts {2} under sounds/ - renaming a file does not convert its format
validate.sound.referenceCarriesExtension={0} '{1}' sets {2}: '{3}' - sound references omit the extension; write '{4}'
validate.planet.badGenerator=planet '{0}' sets generator '{1}', which is not a generator class the game ships; the game ignores the value and always builds an AsteroidGenerator, so the planet gets the asteroid generator instead
validate.planet.meshNotObject=planet '{0}' has a {1} that is neither an object nor an array; the game's planet parser throws "Meshes must be objects." and the planet fails to load - write an object with a "type", or an array of them
validate.planet.meshUnparseable=planet '{0}' has {1} type '{2}', which exists in the game but cannot be built from JSON (the parser only accepts {3}); the game logs an error and falls back to a plain sphere
validate.planet.meshUnknownScript=planet '{0}' has {1} type '{2}', which is not a mesh class the game ships; it only loads if the mod's scripts define it
validate.planet.meshUnknownJson=planet '{0}' has {1} type '{2}', which is not a mesh class the game ships; a JSON mod cannot define new mesh classes
validate.planet.noSectorSize=planet '{0}' has no sectorSize (the JSON default is 0), so it creates no sectors and sector preset '{1}' cannot resolve
validate.planet.sectorSizeTooLarge=planet '{0}' sets sectorSize {1}, past the {2} the game's int-sized grid arrays can hold (a grid of 10 x 3^n + 2 tiles); the planet cannot be built
validate.sector.outOfRange=sector preset '{0}' targets sector {1}, but its planet only has {2} sectors (0 to {3}); the game takes the index modulo that count instead of refusing it, so the preset lands on a different sector

