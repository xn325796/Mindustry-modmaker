# Intentionally empty: this file exists only so that an English request resolves to the English
# base bundle instead of falling back to the default locale's bundle.
#
# ResourceBundle.getBundle("messages", Locale.ENGLISH) tries en, then the JVM's default locale,
# then the base bundle. Without a messages_en.properties, a machine whose default locale is zh_CN
# hands back messages_zh_CN.properties for an English request - which silently broke both the
# English entry in the language menu and Issue.message()'s English rendering (the validation tests
# assert on that text).
#
# No keys are defined here on purpose; every lookup falls through to messages.properties.
