# 校验提示。占位符 {0}/{1}…位置与英文一致；技术名（文件路径、ignoreLiquidFullness、itemCapacity、类名等）保持原样。
validate.meta.emptyName=mod 名称为空；所有内容名称与 bundle key 都依赖它
validate.meta.badFileName=包根目录下是 '{0}'，但游戏只在该处探测 mod.json、mod.hjson、plugin.json 和 plugin.hjson - 它会报 'No mod.json found'
validate.meta.minGameVersion.empty=minGameVersion 为空；游戏会把它按 0 处理，低于其接受的最旧构建，整个模组会被判为过旧而丢弃
validate.meta.minGameVersion.badFormat=minGameVersion '{0}' 不是 160、160.7 这样的构建号；游戏只认第一个点号前的数字，其它写法按 0 处理，整个模组会被判为过旧而丢弃
validate.meta.minGameVersion.tooHigh=minGameVersion '{0}' 要求构建 {1}，高于当前的 160.x；游戏在 160.x 上不会加载这个模组
validate.meta.minGameVersion.classModTooOld=这是一个类模组（java/main），但 minGameVersion '{0}' 低于 154；游戏会把低于 154 的 Java 模组判为过旧，其代码永远不会加载 - 请提高 minGameVersion 或设置 legacyCompatible: true
validate.meta.minGameVersion.tooOld=minGameVersion '{0}' 低于 136；游戏会把低于该构建的模组判为过旧并静默丢弃整个模组 - 请提高它或设置 legacyCompatible: true
validate.encoding.metaBom=meta 文件以 UTF-8 BOM 开头；游戏的解析器会在第一个键之前读到乱码 - 请重新保存为不带 BOM 的 UTF-8
validate.encoding.contentBom=内容 '{0}' 以 UTF-8 BOM 开头；游戏的解析器会在第一个键之前读到乱码 - 请重新保存为不带 BOM 的 UTF-8
validate.name.duplicate=存在两个名为 '{1}' 的 {0} 记录；游戏会对重复的内容名称报错
validate.name.duplicatePatch=存在两个名为 '{1}' 的 {0} 记录；游戏会按顺序应用两次 patch，但注意各自会成为一个独立文件
validate.name.caseCollision={0} 记录 '{1}' 与 '{2}' 仅大小写不同：Windows 与 macOS 无法同时保存这两个文件，下次保存会丢失其中一个记录
validate.name.invalid={0} '{1}'：{2}
validate.type.notFileBacked={0} '{1}' 不能作为文件：游戏没有解析 content/{2} 的解析器
validate.class.missingType={0} '{1}' 未声明 "type"；游戏要求 {0} 必须提供 type
validate.class.unknown={0} '{1}' 使用了类 '{2}'，本版 schema 不认识它 - 其字段会回退为原始 JSON
validate.class.typeMismatch={0} '{1}' 声明了类 '{2}'，它属于 {3}
validate.block.patchWithType=方块 '{0}' 要 patch 原版内容，却声明了 type，这会把它变成一个全新方块
validate.block.tooLarge=方块 '{0}' 的尺寸为 {1}，超过游戏上限 {2}：方块解析器会抛出 "Blocks cannot be larger than {2}"，文件将加载失败
validate.unit.badType=单位 '{0}' 声明了 type '{1}'，游戏会拒绝它 - unit type 是运动种类 {2}，而不是类名
validate.unit.typeNotString=单位 '{0}' 的 type 是对象或数组；游戏会抛出 "Types must be strings"，文件将加载失败
validate.unit.badTemplate=单位 '{0}' 的 template 为 '{1}'，它不是游戏内置的类；游戏会记录日志并改为构建 UnitType，因此该 template 的默认值会丢失
validate.inline.noHost=内联 {0} '{1}' 没有宿主记录，因此永远不会被写出
validate.sprite.missing={0} '{1}' 缺少贴图：游戏会查找区域 '{2}'，它来自 sprites/{3}.png 或变体文件（如 {4}1.png 或 {5}-glow.png）
validate.reference.unresolved={0} '{1}' 在 {3} 中引用了 '{2}'，它既不是本 mod 的内容，也不是已知的原版内容
validate.reference.shadowsVanilla={0} '{1}' 在 {3} 中引用了 '{2}'，本 mod 也定义了它：裸名会绑定到原版条目，请写成 '{4}-{5}' 以引用本 mod 自己的内容
validate.contentOrder.unknown=contentOrder 列出了 '{0}'，它与任何内容文件名都不匹配
validate.bundle.orphanKey=bundle key '{0}' 没有对应的内容文件；游戏会忽略它
validate.board.danglingCard=看板 '{0}' 有一张卡片的内容已不存在；保存时它将会消失
validate.team.missingField=team '{0}' 没有 "team" 键；游戏的 team 解析器会抛出 "Team field missing."，该条目将加载失败
validate.team.notPrimitive=team '{0}' 把 "team" 设成了既不是队伍名也不是数字的东西（数组、对象或 null）；游戏的 team 解析器会为其他任何值抛出 "Unknown team"
validate.team.idOutOfRange=team '{0}' 把 "team" 设为 {1}，但游戏只认 0 到 {2} 的 id（Team.all），其他任何值都会抛出 "Unknown team"
validate.team.badName=team '{0}' 把 "team" 设为 '{1}'，游戏无法按名字解析该队伍 - 解析器只搜索基础队伍（{2}）并抛出 "Unknown team"；其他队伍只能通过 id 访问
validate.bullet.reachShort={1} '{2}' 内的子弹 '{0}' 飞行 {3} 格（speed x lifetime = {4}），未达到炮塔射程 {5} - 射程圈边缘的目标永远不会被命中
validate.bullet.reachLong={1} '{2}' 内的子弹 '{0}' 飞行 {3} 格（speed x lifetime = {4}），超过炮塔射程的三倍 {5} - 它会在远超所有目标处消失，通常是 lifetime 写错了
validate.drill.noTier=钻头 '{0}' 未声明 tier；游戏默认为 0，因此无法开采硬度 1 及以上的物品
validate.drill.tierTooLow=钻头 '{0}' 的 tier 为 {1}，无法开采物品 '{2}'（硬度 {3}）
validate.item.unmineable=物品 '{0}' 的硬度为 {1}，超过本 mod 的所有钻头以及原版上限 {2} - 游戏中没有任何东西能开采它
validate.environment.noSprite=环境方块 '{0}' 缺少贴图：游戏会用 sprites/blocks/environment/{1}.png 或变体文件（如 {2}1.png）构建地形，否则会渲染粉黑相间的缺失贴图棋盘格
validate.environment.wrongFolder=环境方块 '{0}' 的贴图不在 sprites/blocks/environment/ 下，因此地图编辑器的环境调色板不会列出它
validate.crafter.outputItemIgnored=方块 '{0}' 同时设置了 outputItem 和 outputItems；游戏只读取 outputItems，会静默忽略 outputItem
validate.crafter.liquidFullnessUnset=方块 '{0}' 会输出液体但未设置 ignoreLiquidFullness：一旦没有东西接收输出液体会导致制造机停机 - 请设置 ignoreLiquidFullness: true 以便在满时继续制造
validate.crafter.batchTooBig=方块 '{0}' 单次消耗一批 {1} 个物品，但 itemCapacity 只有 {2}{3} - 它永远装不下一整批并会停机；请提高 itemCapacity
validate.sound.badExtension=音频 '{0}' 是 .{1} 文件；游戏的加载器只接受 sounds/ 下的 {2} - 重命名文件不会转换其格式
validate.sound.referenceCarriesExtension={0} '{1}' 设置了 {2}: '{3}' - 音频引用不应带扩展名；请写成 '{4}'
validate.planet.badGenerator=星球 '{0}' 设置了 generator '{1}'，它不是游戏内置的生成器类；游戏会忽略该值并始终构建 AsteroidGenerator，因此该星球会得到小行星生成器
validate.planet.meshNotObject=星球 '{0}' 的 {1} 既不是对象也不是数组；游戏的星球解析器会抛出 "Meshes must be objects."，星球将加载失败 - 请写一个带 "type" 的对象，或由它们组成的数组
validate.planet.meshUnparseable=星球 '{0}' 的 {1} type 为 '{2}'，它在游戏中存在但无法由 JSON 构建（解析器只接受 {3}）；游戏会记录错误并回退为一个朴素球体
validate.planet.meshUnknownScript=星球 '{0}' 的 {1} type 为 '{2}'，它不是游戏内置的 mesh 类；只有当 mod 的脚本定义了它时才会加载
validate.planet.meshUnknownJson=星球 '{0}' 的 {1} type 为 '{2}'，它不是游戏内置的 mesh 类；纯 JSON mod 无法定义新的 mesh 类
validate.planet.noSectorSize=星球 '{0}' 没有 sectorSize（JSON 默认为 0），因此它不创建任何区块，区块预设 '{1}' 无法解析
validate.planet.sectorSizeTooLarge=星球 '{0}' 的 sectorSize 为 {1}，超过了游戏 int 数组能容纳的上限 {2}（网格为 10 x 3^n + 2 个区块）；该星球无法构建
validate.sector.outOfRange=区块预设 '{0}' 指向 sector {1}，但其星球只有 {2} 个区块（0 到 {3}）；游戏会对该数量取模而不是拒绝它，因此该预设会落到另一个区块

