# Pin the build to the JDK 25 that ships inside the project (matches the
# java.toolchain in build.gradle.kts and the JavaFX 25 artifacts).
# Relative path: Gradle resolves it against the directory it is started from,
# so always start the build from the project root (run.bat does 'cd /d %~dp0');
# if you invoke it with -p from elsewhere, use an absolute path instead.
org.gradle.java.home=JDK25
